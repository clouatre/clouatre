name: Update recent writing

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed and update README
        env:
          FEED_URL: https://clouatre.ca/rss.xml
        run: |
          set -euo pipefail
          curl -fsSL -A "clouatre-profile-feedbot/1.0" "$FEED_URL" -o feed.xml
          python3 - <<'PY'
          import re
          import email.utils
          import xml.etree.ElementTree as ET

          root = ET.parse("feed.xml").getroot()

          items = []
          for item in root.iter("item"):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              date = (item.findtext("pubDate") or "").strip()
              if title and link:
                  items.append((date, title, link))
          items.sort(key=lambda x: email.utils.parsedate_to_datetime(x[0]), reverse=True)
          items = items[:5]

          lines = ["| Post | Date |", "| --- | --- |"]
          for date, title, link in items:
              d = date.split(", ", 1)[1].rsplit(" ", 2)[0] if ", " in date else date
              lines.append(f"| [{title}]({link}) | {d} |")
          block = "\n".join(lines)

          with open("README.md") as f:
              readme = f.read()

          pattern = r"(<!-- recent-writing starts -->).*?(<!-- recent-writing ends -->)"
          if not re.search(pattern, readme, re.S):
              raise SystemExit("markers not found in README.md")
          updated = re.sub(pattern, lambda m: m.group(1) + "\n" + block + "\n" + m.group(2), readme, flags=re.S)

          if updated != readme:
              with open("README.md", "w") as f:
                  f.write(updated)
              print("README updated")
          else:
              print("No changes")
          PY

      - name: Commit if changed
        run: |
          git config user.name "clouatre"
          git config user.email "${{ secrets.COMMIT_AUTHOR_EMAIL || 'hugues@clouatre.ca' }}"
          git diff --quiet README.md && echo "nothing to commit" && exit 0
          git add README.md
          git commit -m "chore: refresh recent writing feed"
          git push
